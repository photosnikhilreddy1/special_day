<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Day</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Georgia", serif;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* Container scroll */
.container {
  scroll-snap-type: y mandatory;
  overflow-y: scroll;
  height: 100vh;
}

/* Event block */
.event-block {
  scroll-snap-align: start;
  min-height:100vh;
  display:flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  padding:60px 40px;
  box-sizing:border-box;
}
.event-block h1,
.event-block h2 { margin-bottom:20px; text-align:center; }
.event-date { font-size:14px; opacity:0.8; margin-left:10px; }
.poetry p { margin:6px 0; line-height:1.6; text-align:center; }

/* Scroll indicator */
.scroll-indicator {
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  opacity:0.7;
  font-size:18px;
}

/* First & Last Page */
.event-block.first-last {
  background:#ff577f;
  overflow:hidden;
  position:relative;
}

/* Background image with 125% zoom */
.event-block.first-last::before {
  content:"";
  position:absolute;
  inset:0;
  background: url("background.jpg") center / 125% auto no-repeat;
  opacity:0.25;
  z-index:0;
}

/* Keep text above background */
.event-block.first-last * { position: relative; z-index:1; }
